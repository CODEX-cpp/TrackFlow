[package]
name = "aw-watcher-screenshot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aw-watcher-screenshot"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.6"
serde_json = "1.0"

[profile.release]
opt-level = 2

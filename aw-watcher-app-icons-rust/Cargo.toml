[package]
name = "aw-watcher-app-icons"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aw-watcher-app-icons"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
pelite = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
windows-icons = "0.4"

[profile.release]
opt-level = 2

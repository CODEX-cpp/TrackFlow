[package]
name = "aw-watcher-claude-code"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aw-watcher-claude-code"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2

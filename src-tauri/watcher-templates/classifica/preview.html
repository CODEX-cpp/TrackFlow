<!DOCTYPE html>
<html lang="it">
<head>

      background: transparent;
      color: #b8a999;
    }
    .lista {
      display: flex;

    }

    .riga-nome {
      color: #f2e9dd;
    }
    .riga-durata {
      color: #8a7c6d;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="lista">
    <div class="riga"><span class="riga-nome">Report_2026.xlsx</span><span class="riga-durata">1h 20m</span></div>
    <div class="riga"><span class="riga-nome">Bilancio.xlsx</span><span class="riga-durata">45m</span></div>
    <div class="riga"><span class="riga-nome">Clienti.xlsx</span><span class="riga-durata">12m</span></div>
  </div>
</body>
</html>

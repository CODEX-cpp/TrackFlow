<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      padding: 4px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: transparent;
      color: #b8a999;
      text-align: center;
    }
    .valore-numero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .numero {
      font-size: 28px;
      font-weight: 700;
      color: #d3a355;
      line-height: 1;
    }
    .etichetta {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="valore-numero">
    <div class="numero">42</div>
    <div class="etichetta">valore</div>
  </div>
</body>
</html>

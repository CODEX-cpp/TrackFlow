<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      padding: 4px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: transparent;
      color: #b8a999;
    }
    .ultimo-aggiornamento {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pallino {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #7c9a5c;
      flex-shrink: 0;
    }
    .testo {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="ultimo-aggiornamento">
    <div class="pallino"></div>
    <div class="testo">Ultimo aggiornamento: 3 minuti fa</div>
  </div>
</body>
</html>

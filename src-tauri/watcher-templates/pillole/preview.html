<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      padding: 4px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: transparent;
      color: #b8a999;
    }
    .contenitore {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pillola {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background-color: #2b3037;
      font-size: 11px;
      white-space: nowrap;
    }
    .pillola-chiave {
      color: #8a7c6d;
    }
    .pillola-valore {
      color: #f2e9dd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="contenitore">
    <div class="pillola"><span class="pillola-chiave">stato:</span><span class="pillola-valore">attivo</span></div>
    <div class="pillola"><span class="pillola-chiave">minuti:</span><span class="pillola-valore">12</span></div>
  </div>
</body>
</html>

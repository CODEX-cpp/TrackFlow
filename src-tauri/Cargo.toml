[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
notify-rust = "4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
regex = "1"
chrono = "0.4"
rocket = { version = "0.5.0", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
aw-server = { path = "../aw-server-rust-src/aw-server" }
aw-datastore = { path = "../aw-server-rust-src/aw-datastore", default-features = false }
aw-models = { path = "../aw-server-rust-src/aw-models" }
gethostname = "0.4"

base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading"] }
# Versione "0.61" volutamente diversa da quella sopra (0.62): deve
# combaciare con quella usata internamente da webview2-com (vedi sotto),
# non con la nostra — sono due crate diversi ("windows" e "windows-core"),
# possono coesistere in versioni diverse senza conflitti.
windows-core = "0.61"
webview2-com = "0.38"
# Usata direttamente (non solo tramite notify-rust) per la notifica VPN:
# notify_rust::Notification::image_path() su Windows chiama solo
# Toast::image() di questa stessa libreria sotto il cofano, che imposta
# un'immagine generica nel corpo del toast — MAI l'icona app in alto a
# sinistra (quella è Toast::icon(), non esposto da notify_rust). Serve
# quindi costruire il Toast direttamente per la sola notifica VPN, dove
# l'icona è il punto (vedi vpn_notify.rs).
tauri-winrt-notification = "0.7"
